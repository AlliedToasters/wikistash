[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wikistash"
version = "0.1.0"
description = "A hybrid Wikidata cache library with local DuckDB store and live API fallback"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "duckdb>=1.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "orjson>=3.9",
    "click>=8.0",
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
wikistash = "wikistash.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
